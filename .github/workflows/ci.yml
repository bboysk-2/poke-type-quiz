# ハードゲート: このジョブ "verify" をブランチ保護の Required status check に設定すること（docs/harness.md#ci）。
# 失敗時は .harness/feedback.md（プロンプト化済みの指摘）を PR コメントに貼り、エージェントの次の入力にする。
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify (structure / lint / typecheck / test / deadcode)
        id: verify
        run: pnpm verify
      - name: Post agent-readable feedback
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.existsSync('.harness/feedback.md')
              ? fs.readFileSync('.harness/feedback.md', 'utf8')
              : 'verify がクラッシュしました。ジョブログを確認してください。'
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `<!-- harness-feedback -->\n${body}`,
            })
      - name: Guard - todo.json must not contain unapproved in-progress work on main
        if: github.ref == 'refs/heads/main'
        run: node -e "const t=require('./todo.json');const bad=t.tasks.filter(x=>x.status==='in_progress'&&!x.approvedBy);if(bad.length){console.error('未承認の in_progress タスク:',bad.map(x=>x.id));process.exit(1)}"
